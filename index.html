<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Editor Eléctrico AEA</title>

  <!-- CSS -->

  <link
    rel="stylesheet"
  href="css/styles.css"
  >

</head>

<body>

  <!-- ===== SIDEBAR ===== -->

  <aside class="sidebar">

    <h2 class="sidebar-title">
      Símbolos
    </h2>

    <!-- TP -->

    <div
      class="symbol"
      draggable="true"
      data-type="TP"
    >

      TP

    </div>

    <!-- TS -->

    <div
      class="symbol"
      draggable="true"
      data-type="TS"
    >

      TS

    </div>

  </aside>

  <!-- ===== CANVAS ===== -->

  <main
    class="canvas"
    id="canvas"
  >

  </main>

  <!-- JS -->

  <script src="./js/app.js"></script>

</body>

</html>
