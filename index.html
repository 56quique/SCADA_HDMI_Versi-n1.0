<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Editor Eléctrico AEA</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      display:flex;
      height:100vh;
      overflow:hidden;
      background:#f3f4f6;
    }

    /* ===== SIDEBAR ===== */

    .sidebar{
      width:220px;
      background:#1f2937;
      color:white;
      padding:15px;
      border-right:2px solid #111827;
    }

    .sidebar h2{
      margin-bottom:20px;
    }

    .symbol{
      background:#374151;
      border:1px solid #4b5563;
      padding:12px;
      margin-bottom:10px;
      border-radius:6px;
      cursor:grab;
      text-align:center;
      transition:0.2s;
    }

    .symbol:hover{
      background:#4b5563;
    }

    /* ===== CANVAS ===== */

    .canvas{
      flex:1;
      position:relative;
      overflow:hidden;

      background:
        linear-gradient(to right,#d1d5db 1px,transparent 1px),
        linear-gradient(to bottom,#d1d5db 1px,transparent 1px);

      background-size:20px 20px;
    }

    /* ===== NODOS ===== */

    .node{
      position:absolute;
      width:140px;
      height:60px;
      cursor:move;
      user-select:none;
    }

    .node svg{
      width:100%;
      height:100%;
      overflow:visible;
    }

    /* ===== MODAL ===== */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);

      display:none;
      justify-content:center;
      align-items:center;
    }

    .modal-content{
      width:900px;
      height:600px;
      background:white;
      border-radius:10px;
      overflow:hidden;

      display:flex;
      flex-direction:column;
    }

    .modal-header{
      background:#111827;
      color:white;
      padding:12px;

      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .close-btn{
      border:none;
      background:#ef4444;
      color:white;
      padding:8px 12px;
      border-radius:4px;
      cursor:pointer;
    }

    /* ===== MINI CANVAS ===== */

    .mini-canvas{
      flex:1;
      position:relative;

      background:
        linear-gradient(to right,#e5e7eb 1px,transparent 1px),
        linear-gradient(to bottom,#e5e7eb 1px,transparent 1px);

      background-size:20px 20px;
    }

  </style>

</head>

<body>

  <!-- ===== SIDEBAR ===== -->

  <div class="sidebar">

    <h2>Símbolos</h2>

    <div class="symbol"
         draggable="true"
         data-type="TP">

      TP

    </div>

    <div class="symbol"
         draggable="true"
         data-type="TS">

      TS

    </div>

  </div>

  <!-- ===== CANVAS ===== -->

  <div class="canvas" id="canvas"></div>

  <!-- ===== MODAL ===== -->

  <div class="modal" id="modal">

    <div class="modal-content">

      <div class="modal-header">

        <h3 id="modalTitle">
          Editor Interno
        </h3>

        <button class="close-btn"
                id="closeModal">

          Cerrar

        </button>

      </div>

      <div class="mini-canvas"
           id="miniCanvas"></div>

    </div>

  </div>

  <script>

    const canvas =
      document.getElementById("canvas");

    const modal =
      document.getElementById("modal");

    const modalTitle =
      document.getElementById("modalTitle");

    const closeModal =
      document.getElementById("closeModal");

    let nodeCounter = 0;

    // ===== DRAG DESDE SIDEBAR =====

    document
      .querySelectorAll(".symbol")
      .forEach(symbol => {

        symbol.addEventListener(
          "dragstart",
          e => {

            e.dataTransfer.setData(
              "type",
              symbol.dataset.type
            );

          }
        );

      });

    // ===== HABILITAR DROP =====

    canvas.addEventListener(
      "dragover",
      e => {

        e.preventDefault();

      }
    );

    canvas.addEventListener(
      "drop",
      e => {

        e.preventDefault();

        const type =
          e.dataTransfer.getData("type");

        const rect =
          canvas.getBoundingClientRect();

        const x =
          e.clientX - rect.left;

        const y =
          e.clientY - rect.top;

        createNode(type, x, y);

      }
    );

    // ===== CREAR NODO =====

    function createNode(type, x, y){

      const node =
        document.createElement("div");

      node.classList.add("node");

      node.style.left = x + "px";
      node.style.top = y + "px";

      node.dataset.id =
        "node_" + nodeCounter++;

      node.innerHTML =
        getSVG(type);

      canvas.appendChild(node);

      enableDrag(node);

      // ===== DOBLE CLICK =====

      node.addEventListener(
        "dblclick",
        () => {

          modal.style.display = "flex";

          modalTitle.innerText =
            "Editor interno - " + type;

        }
      );

    }

    // ===== SVG =====

    function getSVG(type){

      if(type === "TP"){

        return `
        
        <svg xmlns="http://www.w3.org/2000/svg"
             width="140"
             height="60"
             viewBox="0 0 140 60">

          <rect
            x="10"
            y="10"
            width="100"
            height="40"
            fill="white"
            stroke="black"
            stroke-width="2"
          />

          <line
            x1="10"
            y1="10"
            x2="110"
            y2="50"
            stroke="black"
            stroke-width="2"
          />

          <line
            x1="110"
            y1="10"
            x2="10"
            y2="50"
            stroke="black"
            stroke-width="2"
          />

          <text
            x="118"
            y="35"
            font-size="14"
            font-family="Arial"
          >
            TP
          </text>

        </svg>

        `;
      }

      if(type === "TS"){

        return `
        
        <svg xmlns="http://www.w3.org/2000/svg"
             width="140"
             height="60"
             viewBox="0 0 140 60">

          <rect
            x="10"
            y="10"
            width="100"
            height="40"
            fill="white"
            stroke="black"
            stroke-width="2"
          />

          <line
            x1="20"
            y1="20"
            x2="100"
            y2="40"
            stroke="black"
            stroke-width="2"
          />

          <text
            x="118"
            y="35"
            font-size="14"
            font-family="Arial"
          >
            TS
          </text>

        </svg>

        `;
      }

      return "";

    }

    // ===== MOVER NODOS =====

    function enableDrag(node){

      let isDragging = false;

      let offsetX = 0;
      let offsetY = 0;

      node.addEventListener(
        "mousedown",
        e => {

          isDragging = true;

          offsetX =
            e.clientX - node.offsetLeft;

          offsetY =
            e.clientY - node.offsetTop;

        }
      );

      document.addEventListener(
        "mousemove",
        e => {

          if(!isDragging) return;

          node.style.left =
            (e.clientX - offsetX) + "px";

          node.style.top =
            (e.clientY - offsetY) + "px";

        }
      );

      document.addEventListener(
        "mouseup",
        () => {

          isDragging = false;

        }
      );

    }

    // ===== CERRAR MODAL =====

    closeModal.addEventListener(
      "click",
      () => {

        modal.style.display = "none";

      }
    );

  </script>

</body>

</html>
