<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NÚCLEO Home — Prueba de Servidor</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; padding: 30px 20px;
    }

    h1 {
      font-size: 1.2rem; letter-spacing: 4px;
      text-transform: uppercase; color: #38bdf8;
      margin-bottom: 6px;
    }
    .subtitulo {
      font-size: 0.85rem; color: #555;
      letter-spacing: 2px; margin-bottom: 30px;
    }

    /* ── Estado de conexión ── */
    .estado-conexion {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px;
    }
    .indicador {
      width: 12px; height: 12px; border-radius: 50%;
      background: #555; transition: background 0.3s;
    }
    .indicador.conectado  { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    .indicador.error      { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .estado-texto {
      font-size: 0.9rem; letter-spacing: 2px;
      text-transform: uppercase; color: #555;
    }

    /* ── Log de mensajes ── */
    .log-titulo {
      font-size: 0.75rem; letter-spacing: 3px;
      text-transform: uppercase; color: #555;
      margin-bottom: 10px;
    }
    .log {
      background: #0a1a2e; border: 1px solid #1e3a5f;
      border-radius: 12px; padding: 16px;
      min-height: 200px; max-height: 400px;
      overflow-y: auto; margin-bottom: 24px;
    }
    .log-item {
      font-size: 0.9rem; color: #e2e8f0;
      padding: 8px 0; border-bottom: 1px solid #1e3a5f11;
      line-height: 1.4;
    }
    .log-item:last-child { border-bottom: none; }
    .log-item .hora { color: #555; font-size: 0.8rem; margin-right: 8px; }
    .log-item .tipo-comando   { color: #38bdf8; }
    .log-item .tipo-panico    { color: #ef4444; }
    .log-item .tipo-sistema   { color: #4ade80; }

    /* ── Panel de respuesta manual ── */
    .panel-titulo {
      font-size: 0.75rem; letter-spacing: 3px;
      text-transform: uppercase; color: #555;
      margin-bottom: 10px;
    }
    .input-respuesta {
      width: 100%; padding: 14px 16px;
      background: #0a1a2e; border: 1px solid #1e3a5f;
      border-radius: 12px; color: #fff;
      font-family: 'Rajdhani', sans-serif; font-size: 1rem;
      margin-bottom: 12px; outline: none;
    }
    .input-respuesta:focus { border-color: #38bdf8; }
    .btn-enviar {
      width: 100%; padding: 14px;
      background: #0a1a2e; border: 2px solid #38bdf8;
      border-radius: 50px; color: #38bdf8;
      font-family: 'Rajdhani', sans-serif; font-size: 1rem;
      font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
      cursor: pointer; transition: box-shadow 0.2s;
    }
    .btn-enviar:active { box-shadow: 0 0 20px #38bdf855; }
    .btn-limpiar {
      width: 100%; padding: 12px; margin-top: 10px;
      background: transparent; border: 1px solid #333;
      border-radius: 50px; color: #555;
      font-family: 'Rajdhani', sans-serif; font-size: 0.9rem;
      letter-spacing: 3px; text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>NÚCLEO Home</h1>
  <div class="subtitulo">Simulador de ESP32 — Prueba de servidor</div>

  <!-- Estado de conexión -->
  <div class="estado-conexion">
    <div class="indicador" id="indicador"></div>
    <span class="estado-texto" id="estadoTexto">Conectando...</span>
  </div>

  <!-- Log de mensajes recibidos -->
  <div class="log-titulo">Mensajes recibidos del servidor</div>
  <div class="log" id="log">
    <div class="log-item">
      <span class="hora">--:--</span>
      <span style="color:#555">Esperando mensajes...</span>
    </div>
  </div>

  <!-- Panel para responder manualmente -->
  <div class="panel-titulo">Responder al dashboard (simular ESP32)</div>
  <input class="input-respuesta" id="inputRespuesta"
    type="text" placeholder="Ej: Luz encendida correctamente" />
  <button class="btn-enviar" onclick="enviarRespuesta()">Enviar respuesta</button>
  <button class="btn-limpiar" onclick="limpiarLog()">Limpiar log</button>

  <script>
    // ── CONFIGURACIÓN ────────────────────────────────────────────
    const URL_SERVIDOR = 'wss://domoticaklenser.onrender.com';

    // ── VARIABLES ────────────────────────────────────────────────
    let ws = null;

    // ── CONEXIÓN AL SERVIDOR ─────────────────────────────────────
    function conectar() {
      ws = new WebSocket(URL_SERVIDOR);

      ws.onopen = () => {
        // Se identifica como ESP32
        ws.send(JSON.stringify({ tipo: 'esp32' }));
        setEstado('conectado', 'Conectado como ESP32');
        agregarLog('sistema', 'Conectado al servidor');
      };

      ws.onmessage = (evento) => {
        try {
          const datos = JSON.parse(evento.data);
          procesarMensaje(datos);
        } catch (e) {
          agregarLog('sistema', 'Mensaje no válido: ' + evento.data);
        }
      };

      ws.onclose = () => {
        setEstado('error', 'Desconectado — reintentando...');
        agregarLog('sistema', 'Conexión cerrada, reintentando en 5 segundos...');
        setTimeout(conectar, 5000);
      };

      ws.onerror = () => {
        setEstado('error', 'Error de conexión');
      };
    }

    // ── PROCESAR MENSAJE RECIBIDO ────────────────────────────────
    function procesarMensaje(datos) {
      const tipo = datos.tipo || 'desconocido';

      if (tipo === 'comando') {
        // Llegó un comando de voz del dashboard
        agregarLog('comando', '🎤 Comando: "' + datos.texto + '"');

      } else if (tipo === 'panico') {
        // Llegó una alerta de pánico
        agregarLog('panico', '🚨 ALERTA DE PÁNICO');

      } else {
        // Cualquier otro mensaje del servidor
        agregarLog('sistema', JSON.stringify(datos));
      }
    }

    // ── ENVIAR RESPUESTA MANUAL ──────────────────────────────────
    // Simula lo que haría el ESP32 al responder un comando
    function enviarRespuesta() {
      const input = document.getElementById('inputRespuesta');
      const texto = input.value.trim();

      if (!texto) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        agregarLog('sistema', 'No hay conexión con el servidor');
        return;
      }

      // Manda la respuesta al servidor para que la reenvíe al dashboard
      ws.send(JSON.stringify({
        tipo: 'respuesta',
        mensaje: texto
      }));

      agregarLog('sistema', '📤 Respuesta enviada: "' + texto + '"');
      input.value = '';   // Limpia el campo
    }

    // ── AGREGAR ENTRADA AL LOG ───────────────────────────────────
    function agregarLog(tipo, texto) {
      const log   = document.getElementById('log');
      const ahora = new Date();
      const hora  = String(ahora.getHours()).padStart(2, '0') + ':' +
                    String(ahora.getMinutes()).padStart(2, '0') + ':' +
                    String(ahora.getSeconds()).padStart(2, '0');

      // Limpiamos el mensaje inicial si es la primera entrada
      if (log.children.length === 1 && log.children[0].querySelector('[style*="555"]')) {
        log.innerHTML = '';
      }

      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<span class="hora">${hora}</span><span class="tipo-${tipo}">${texto}</span>`;

      log.appendChild(item);
      log.scrollTop = log.scrollHeight;   // Hace scroll al último mensaje
    }

    // ── LIMPIAR LOG ──────────────────────────────────────────────
    function limpiarLog() {
      document.getElementById('log').innerHTML =
        '<div class="log-item"><span class="hora">--:--</span><span style="color:#555">Log limpiado</span></div>';
    }

    // ── ESTADO VISUAL DE CONEXIÓN ────────────────────────────────
    function setEstado(estado, texto) {
      const ind  = document.getElementById('indicador');
      const txt  = document.getElementById('estadoTexto');
      ind.className  = 'indicador ' + estado;
      txt.textContent = texto;
    }

    // ── ENVIAR CON ENTER ─────────────────────────────────────────
    document.getElementById('inputRespuesta').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enviarRespuesta();
    });

    // Iniciamos la conexión al cargar la página
    conectar();
  </script>

</body>
</html>
