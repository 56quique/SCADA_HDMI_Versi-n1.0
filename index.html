<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- Título de la pestaña -->
  <title>SCADA - Transferencia Automática</title>


  <!-- 🔥 ESTA LÍNEA ES CLAVE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Vinculación del CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Título principal -->
  <h1>SCADA - Grupo Electrógeno</h1>

  <!-- Contenedor general -->
  <div class="container">

 <!-- RED -->
<div class="panel">
  <h2>RED</h2>

  <div class="fila">

    <div class="instrumento">
      <div class="etiqueta">L1</div>
      <canvas id="redV1"></canvas>
      <canvas id="redI1"></canvas>
    </div>

    <div class="instrumento">
      <div class="etiqueta">L2</div>
      <canvas id="redV2"></canvas>
      <canvas id="redI2"></canvas>
    </div>

    <div class="instrumento">
      <div class="etiqueta">L3</div>
      <canvas id="redV3"></canvas>
      <canvas id="redI3"></canvas>
    </div>

  </div>
</div>


<!-- GRUPO -->
<div class="panel">
  <h2>GRUPO</h2>

  <div class="fila">

    <div class="instrumento">
      <div class="etiqueta">L1</div>
      <canvas id="grupoV1"></canvas>
      <canvas id="grupoI1"></canvas>
    </div>

    <div class="instrumento">
      <div class="etiqueta">L2</div>
      <canvas id="grupoV2"></canvas>
      <canvas id="grupoI2"></canvas>
    </div>

    <div class="instrumento">
      <div class="etiqueta">L3</div>
      <canvas id="grupoV3"></canvas>
      <canvas id="grupoI3"></canvas>
    </div>

  </div>
</div>

<div class="panel">
  <h2>POTENCIA</h2>

  <div class="potencia">

    <div class="dato">
      <span>P (kW)</span>
      <div id="potP">0</div>
    </div>

    <div class="dato">
      <span>Q (kVAr)</span>
      <div id="potQ">0</div>
    </div>

    <div class="dato">
      <span>S (kVA)</span>
      <div id="potS">0</div>
    </div>

    <div class="dato">
      <span>cos φ</span>
      <div id="cosfi">0</div>
    </div>

  </div>
</div>

  <!-- Importante: type="module" para poder usar imports en JS -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
